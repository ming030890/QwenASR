[package]
name = "yue-tools"
version = "0.1.0"
edition = "2021"

# Offline experiment harness for Cantonese ASR rule-based correction.
# Uses the qwen-asr library directly for inference. The mp3 decoder dependency
# (symphonia) lives here, NOT in the core qwen-asr crate.

[[bin]]
name = "yue-tools"
path = "src/main.rs"

[dependencies]
qwen-asr = { path = "../qwen-asr" }
# Keep zhconv-rs defaults (MediaWiki) and merge in OpenCC tables. The dataset
# conversion layer separately protects transcription-sensitive Cantonese forms.
zhconv = { version = "0.4.1", features = ["opencc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "isomp4", "aac"] }
