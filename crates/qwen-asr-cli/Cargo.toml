[package]
name = "qwen-asr-cli"
version = "0.7.0"
edition.workspace = true
license.workspace = true
description = "CLI for qwen-asr: Qwen3-ASR speech-to-text"
keywords = ["asr", "speech-recognition", "qwen", "cli"]
categories = ["command-line-utilities", "multimedia::audio"]
repository = "https://github.com/huanglizhuo/QwenASR"
homepage = "https://github.com/huanglizhuo/QwenASR"
readme = "README.md"

[[bin]]
name = "qwen-asr"
path = "src/main.rs"

[[bin]]
name = "qwen-asr-bench-android"
path = "src/bin/bench_android.rs"

[dependencies]
ureq = "2"
ctrlc = "3"

[target.'cfg(not(target_os = "android"))'.dependencies]
qwen-asr = { workspace = true, features = ["blas", "vdsp"] }

[target.'cfg(target_os = "android")'.dependencies]
qwen-asr = { workspace = true, default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
coreaudio-sys = "0.2"
