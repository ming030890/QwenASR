[workspace]
resolver = "2"
members = ["crates/qwen-asr", "crates/qwen-asr-cli", "crates/yue-tools"]
exclude = ["flutter/qwen_asr/rust"]  # Cargokit builds independently

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# x-release-please-version
qwen-asr = { version = "0.7.0", path = "crates/qwen-asr", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
